spring:
  application:
    name: customer-auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/customer_auth_db
    username: postgres
    password: Bur@76943

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    config:
      enabled: false

server:
  port: 8082

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

jwt:
  secret: test-secret-key-for-testing-purposes-only-do-not-use-in-production
  expiration: 3600000

notification:
  service:
    base-url: http://localhost:8087

